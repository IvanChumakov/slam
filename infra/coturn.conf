# Secret and address settings are appended in tmpfs by turn-start.sh.
tls-listening-port=5349
min-port=49160
max-port=49200
no-udp
no-tcp
dtls=false
no-tcp-relay
use-auth-secret
fingerprint
stale-nonce=600
user-quota=12
total-quota=40
cli=false
no-multicast-peers
# Only the configured LiveKit public IPv4 is allowed by the runtime config.
denied-peer-ip=0.0.0.0-255.255.255.255
denied-peer-ip=::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
cert=/etc/coturn/tls/fullchain.pem
pkey=/etc/coturn/tls/privkey.pem
pidfile=/tmp/turnserver.pid
log-file=stdout
simple-log
