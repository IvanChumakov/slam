name: slam-local

x-backend-environment: &backend-environment
  ENVIRONMENT: development
  BOT_TOKEN: ${BOT_TOKEN:-123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi}
  DATABASE_URL: postgresql+asyncpg://slam:slam-local-password@db:5432/slam
  FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-http://localhost:5173}
  BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost:8000}
  ALLOWED_ORIGINS: http://localhost:5173
  ALLOWED_HOSTS: localhost,127.0.0.1,api
  JOIN_TOKEN_SECRET: local-development-join-secret-change-me
  JOIN_TOKEN_TTL_SECONDS: 86400
  LIVEKIT_URL: ws://localhost:7880
  LIVEKIT_API_KEY: devkey
  LIVEKIT_API_SECRET: local-development-secret-change-me

x-backend-service: &backend-service
  image: slam-backend:local
  build:
    context: ./backend
  environment: *backend-environment
  networks:
    - app
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  init: true

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: slam
      POSTGRES_USER: slam
      POSTGRES_PASSWORD: slam-local-password
    volumes:
      - local_postgres_data:/var/lib/postgresql/data
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slam -d slam"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true

  migrate:
    <<: *backend-service
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend-service
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  livekit:
    image: livekit/livekit-server:v1.13.1
    command: ["--config", "/etc/livekit/livekit.yaml"]
    environment:
      LIVEKIT_KEYS: "devkey: local-development-secret-change-me"
    volumes:
      - ./infra/livekit.integrated.yaml:/etc/livekit/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    networks:
      - app
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s

  frontend:
    image: slam-frontend:local
    build:
      context: ./frontend
      target: development
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_USE_MOCK_API: "false"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    networks:
      - app
    depends_on:
      api:
        condition: service_healthy
      livekit:
        condition: service_started

  invite:
    <<: *backend-service
    command: ["python", "-m", "app.local_invite"]
    profiles: ["tools"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  bot:
    <<: *backend-service
    command: ["python", "-m", "app.bot.polling"]
    healthcheck:
      disable: true
    profiles: ["telegram"]
    depends_on:
      migrate:
        condition: service_completed_successfully

networks:
  app:

volumes:
  local_postgres_data:
  frontend_node_modules:
