[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "telegram-voice-backend"
version = "0.1.0"
description = "Telegram voice rooms backend"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.28,<4",
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.128,<1",
  "livekit-api>=1.0,<2",
  "pydantic-settings>=2.10,<3",
  "PyJWT>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0.51,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.21,<1",
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

